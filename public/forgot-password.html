<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password – Galactic Threads</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

    <div class="auth-container">
        <h1 class="section-title">Forgot Password</h1>
        <p class="auth-subtext">Enter your email and we’ll send you a reset link.</p>

        <form id="resetRequestForm" class="auth-form">
            <input type="email" id="email" placeholder="Email address" required class="auth-input">
            <button class="tron-btn" type="submit">Send Reset Link</button>
        </form>

        <p class="auth-link">
            <a href="login.html">Back to Login</a>
        </p>
    </div>

    <script>
        document.getElementById("resetRequestForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;

            await fetch("/api/auth/request-reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });

            alert("If that email exists, a reset link has been sent.");
        });
    </script>

</body>
</html>
