<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password – Galactic Threads</title>
    <link rel="stylesheet" href="assets/css/styles.css">

</head>

<body class="auth-body">

    <div class="auth-container">
        <h1 class="section-title">Reset Password</h1>
        <p class="auth-subtext">Enter your new password below.</p>

        <form id="resetForm" class="auth-form">
            <input type="password" id="password" placeholder="New password" required class="auth-input">
            <input type="password" id="confirm" placeholder="Confirm password" required class="auth-input">
            <button class="tron-btn" type="submit">Reset Password</button>
        </form>

        <p class="auth-link">
            <a href="login.html">Back to Login</a>
        </p>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get("token");

        document.getElementById("resetForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm").value;

            if (password !== confirm) {
                alert("Passwords do not match.");
                return;
            }

            const res = await fetch("/api/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, password })
            });

            const data = await res.json();
            alert(data.message);

            if (res.ok) {
                window.location.href = "login.html";
            }
        });
    </script>

</body>
</html>
